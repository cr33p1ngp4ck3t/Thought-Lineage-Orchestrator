name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-lock.txt -r requirements-dev-lock.txt
      - run: ruff check src tests
      - run: pytest tests -v --maxfail=1 --cov=src --cov-report=term-missing
