name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-lock.txt -r requirements-dev-lock.txt
      - run: ruff check src tests
      - run: pytest tests -v --maxfail=1 --cov=src --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t thought-lineage-orchestrator .
      - run: docker run -d --name tlo -p 5000:5000 thought-lineage-orchestrator
      - run: |
          for attempt in {1..20}; do
            curl --fail http://127.0.0.1:5000/health && exit 0
            sleep 1
          done
          docker logs tlo
          exit 1
