[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/test_agents.py", "src/test_contradiction.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["src"]
omit = ["src/test_*.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == [\"']__main__[\"']:"]
